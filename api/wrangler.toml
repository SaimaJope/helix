name = "helix-content-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

[vars]
GITHUB_REPO = "SaimaJope/helix"
GITHUB_BRANCH = "main"
ALLOWED_ORIGINS = "https://helix-anthropis.eu,https://www.helix-anthropis.eu,https://saimajope.github.io,http://127.0.0.1:5500,http://localhost:5500"

[[kv_namespaces]]
binding = "AUTH_KV"
id = "1a5bf5699f50484bac676359ab74b615"

# Login throttling: 5 attempts per minute per IP and per username.
[[ratelimits]]
name = "LOGIN_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Secrets (never in this file):
#   npx wrangler secret put USERS
#   npx wrangler secret put SESSION_SECRET
#   npx wrangler secret put GITHUB_TOKEN
